# Project
project_name:
  type: str

project_type:
  type: str
  choices:
    - ConsoleApp
    - WindowedApp
    - SharedLib
    - StaticLib
    - Makefile
    - Utility
    - None
    - Packaging
    - SharedItems
  default: ConsoleApp

flat_repo:
  type: bool
  default: true

# Dependencies
use_libft:
  type: bool
  default: false

# Build systems
turin_make:
  type: bool
  default: true

submit_makefile:
  type: bool
  default: true

use_premake:
  type: bool
  default: false

use_meson:
  type: bool
  default: false

use_just:
  type: bool
  default: false

# Tooling
use_clangd:
  type: bool
  default: true

use_clang_format:
  type: bool
  default: true

# Deployment
copy_build_to_root:
  type: bool
  default: true

_subdirectory: template

_exclude:
  - "{% if not use_just %}justfile{% endif %}"
  - "{% if not use_premake %}premake5.lua{% endif %}"
  - "{% if not use_premake %}.styllua.toml{% endif %}"
  - "{% if not use_premake %}.luarc.json{% endif %}"
  - "{% if use_premake or not turin_make %}Makefile.jinja{% endif %}"
  - "{% if not use_meson %}meson.build{% endif %}"
  - "{% if not use_clangd %}**/.clang-tidy{% endif %}"
  - "{% if not use_clang_format %}**/.clang-format-ignore{% endif %}"
