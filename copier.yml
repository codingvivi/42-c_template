# Project
project_name:
  type: str

project_type:
  type: str
  choices:
    - ConsoleApp
    - WindowedApp
    - SharedLib
    - StaticLib
    - Makefile
    - Utility
    - None
    - Packaging
    - SharedItems
  default: ConsoleApp

flat_repo:
  type: bool
  default: true

# Dependencies
use_libft:
  type: bool
  default: false

# Build system
build_system:
  type: str
  choices:
    - makefile
    - premake
    - meson
  default: makefile

submit_makefile:
  type: bool
  default: true
  when: "{{ build_system == 'makefile' }}"

use_just:
  type: bool
  default: false

# Tooling
use_clangd:
  type: bool
  default: true

use_clang_format:
  type: bool
  default: true

# Deployment
copy_build_to_root:
  type: bool
  default: true

_subdirectory: template

_tasks:
  - command: "git submodule add https://github.com/codingvivi/42-libft external/lib/libft"
    when: "{{ use_libft }}"

_exclude:
  - "{% if not use_just %}justfile{% endif %}"
  - "{% if build_system != 'premake' %}premake5.lua{% endif %}"
  - "{% if build_system != 'premake' %}.styllua.toml{% endif %}"
  - "{% if build_system != 'premake' %}.luarc.json{% endif %}"
  - "{% if build_system != 'makefile' %}Makefile.jinja{% endif %}"
  - "{% if build_system != 'meson' %}meson.build{% endif %}"
  - "{% if not use_clangd %}**/.clang-tidy{% endif %}"
  - "{% if not use_clang_format %}**/.clang-format-ignore{% endif %}"
